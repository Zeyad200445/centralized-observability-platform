# ===========================================================================
# Ansible configuration for the observability platform.
#
# This playbook does NOT manage servers over SSH. Every task runs on the
# control node and talks to the Kubernetes API through kubernetes.core, so
# connection/privilege-escalation settings are deliberately minimal.
# ===========================================================================
[defaults]
inventory                   = inventory/hosts.ini
roles_path                  = roles
collections_path            = collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking           = False
retry_files_enabled         = False
stdout_callback = default
bin_ansible_callbacks       = True
callbacks_enabled           = profile_tasks, timer
display_skipped_hosts       = False
interpreter_python          = auto_silent
forks                       = 10
timeout                     = 60
deprecation_warnings        = False
localhost_warning           = False

# Jinja2 behaviour. keep_trailing_newline matters because the rendered Helm
# values and Kubernetes manifests are parsed as YAML downstream.
jinja2_native               = False

[inventory]
unparsed_is_failed          = True

[privilege_escalation]
become                      = False

[persistent_connection]
command_timeout             = 120
connect_timeout             = 60

[ssh_connection]
pipelining                  = True
