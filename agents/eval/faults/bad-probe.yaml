apiVersion: v1
kind: Pod
metadata:
  name: eval-badprobe
  namespace: workload
  labels:
    app: eval-badprobe
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      readinessProbe:
        tcpSocket:
          port: 9999
        initialDelaySeconds: 2
        periodSeconds: 3
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "50m", memory: "32Mi" }
