apiVersion: v1
kind: Pod
metadata:
  name: eval-crashloop
  namespace: workload
  labels:
    app: eval-crashloop
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'ERROR FATAL: database connection refused on port 3306' >&2; exit 1"]
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "50m", memory: "32Mi" }
