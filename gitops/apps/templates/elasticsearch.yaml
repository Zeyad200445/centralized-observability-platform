# Sync wave 1: Elasticsearch first; everything else depends on it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elasticsearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.elastic.co
      chart: elasticsearch
      targetRevision: "{{ .Values.elasticStackVersion }}"
      helm:
        releaseName: elasticsearch
        valueFiles:
          - $values/gitops/values/elasticsearch/values-{{ .Values.env }}.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  {{- include "obs.syncPolicy" . | nindent 2 }}
