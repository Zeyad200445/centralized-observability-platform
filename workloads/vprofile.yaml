---
# 1. Secret للبيانات السرية (MySQL & RabbitMQ)
apiVersion: v1
kind: Secret
metadata:
  name: vprofile-secrets
  namespace: workload
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "vprodbpass"
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"

---
# 2. PVC لقاعدة البيانات MySQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vprodb-pvc
  namespace: workload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# 3. MySQL (vprodb)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprodb
  namespace: workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vprodb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vprodb
    spec:
      containers:
        - name: vprodb
          image: zeyaddev/vprofile-images:db-v1
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vprofile-secrets
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: vprodb-storage
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1 FROM accounts.user LIMIT 1;"
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h localhost -u root -p"$MYSQL_ROOT_PASSWORD"
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: vprodb-storage
          persistentVolumeClaim:
            claimName: vprodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vprodb
  namespace: workload
spec:
  selector:
    app: vprodb
  ports:
    - port: 3306
      targetPort: 3306

---
# 4. Memcached (vprocache01)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprocache01
  namespace: workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vprocache01
  template:
    metadata:
      labels:
        app: vprocache01
    spec:
      containers:
        - name: vprocache01
          image: memcached:alpine
          ports:
            - containerPort: 11211
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vprocache01
  namespace: workload
spec:
  selector:
    app: vprocache01
  ports:
    - port: 11211
      targetPort: 11211

---
# 5. RabbitMQ (vpromq01)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpromq01
  namespace: workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpromq01
  template:
    metadata:
      labels:
        app: vpromq01
    spec:
      containers:
        - name: vpromq01
          image: rabbitmq:3-alpine
          ports:
            - containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: vprofile-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: vprofile-secrets
                  key: RABBITMQ_DEFAULT_PASS
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vpromq01
  namespace: workload
spec:
  selector:
    app: vpromq01
  ports:
    - port: 5672
      targetPort: 5672

---
# 6. Tomcat Application (vproapp)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproapp
  namespace: workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vproapp
  template:
    metadata:
      labels:
        app: vproapp
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z vprodb 3306; do
                echo "Waiting for vprodb to be ready..."
                sleep 5
              done
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
      containers:
        - name: vproapp
          image: zeyaddev/vprofile-images:app-v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "600m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vproapp
  namespace: workload
spec:
  selector:
    app: vproapp
  ports:
    - port: 8080
      targetPort: 8080

---
# 7. Nginx Web + Prometheus Exporter Sidecar (vproweb)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproweb
  namespace: workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vproweb
  template:
    metadata:
      labels:
        app: vproweb
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: nginx
          image: zeyaddev/vprofile-images:web-v1
          ports:
            - containerPort: 80
            - containerPort: 8081
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args:
            - "-nginx.scrape-uri=http://127.0.0.1:8081/stub_status"
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vproweb
  namespace: workload
spec:
  selector:
    app: vproweb
  ports:
    - port: 80
      targetPort: 80
